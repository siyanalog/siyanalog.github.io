<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="/js/site-mode.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/projects/">Projects</a>
        <a href="/experience/">Experience</a>
        <a href="/blog/" aria-current="page">Blog</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">Notes & ideas & Writeups</p>
      <h1>Blog?</h1>
    </section>

    <!--
      MULTI-SELECT TAG FILTERS
      Add buttons here for new tags. No tag selected = show every post.
      Example: <button class="filter-button" type="button" data-filter="firmware" aria-pressed="false">Firmware</button>
      Then add firmware to the matching posts' data-tags.
    -->
    <section class="filters" aria-label="Filter posts by tags">
      <div class="filter-list" role="group" aria-label="Post tags">
        <button class="filter-button" type="button" data-filter="technical" aria-pressed="false">technical</button>
      </div>
      <button class="filter-clear" type="button">Clear</button>
    </section>

    <!--
      To tag a post, add tags to data-tags separated by spaces, e.g.
      data-tags="courses" or data-tags="courses firmware".
    -->
    <section class="section">
      <article class="blog-entry filter-item" data-tags="technical">
        <a class="blog-entry-link" href="blog-post-01.html" aria-labelledby="post-01-title">
          <h2 id="post-01-title">Journey to Embedded Engineering</h2>
          <p>TBC</p>
          <div class="project-tags blog-tags" aria-label="Post tags">
            <span>technical</span>
          </div>
        </a>
      </article>
    </section>

    <p class="no-results" hidden>No posts match the selected tags.</p>
  </main>

  <footer class="site-footer"><div>© Siyan — Portfolio</div></footer>
  <script src="../js/tag-filters.js"></script>
</body>
</html>
